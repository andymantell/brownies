name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Run the tests from src/tests.js in a headless browser. If any fail, we don't deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a headless browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run the tests
        run: |
          python3 serve.py &
          sleep 2
          node tools/run-tests.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No build step: the game is plain HTML + JavaScript, so just publish the files.
      # The JavaScript goes in a folder named after the commit, and version.txt points
      # index.html at it, so browsers never mix old cached files with a new deploy.
      - name: Collect site files
        run: |
          VERSION="${GITHUB_SHA::8}"
          mkdir -p "_site/$VERSION"
          cp index.html _site/
          cp -r src vendor "_site/$VERSION/"
          echo "$VERSION" > _site/version.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

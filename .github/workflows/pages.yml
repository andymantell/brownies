name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No build step: the game is plain HTML + JavaScript, so just publish the files.
      # The JavaScript goes in a folder named after the commit, and version.txt points
      # index.html at it, so browsers never mix old cached files with a new deploy.
      - name: Collect site files
        run: |
          VERSION="${GITHUB_SHA::8}"
          mkdir -p "_site/$VERSION"
          cp index.html _site/
          cp -r src vendor "_site/$VERSION/"
          echo "$VERSION" > _site/version.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
